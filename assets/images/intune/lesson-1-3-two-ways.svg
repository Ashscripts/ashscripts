<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">The Two Ways to Get Intune</title><desc id="d">Diagram for The Two Ways to Get Intune</desc><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0c130d"/><stop offset="1" stop-color="#050805"/></linearGradient><linearGradient id="lime" x1="0" x2="1"><stop offset="0" stop-color="#d9ff00"/><stop offset="1" stop-color="#93b800"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9ff00"/></marker><style>.bg{fill:#030503}.box{fill:url(#panel);stroke:#243224;stroke-width:2}.limebox{fill:#0b1008;stroke:#d9ff00;stroke-width:2}
.title{fill:#f4f7f3;font:800 26px Inter,Arial,sans-serif}.sub{fill:#8f998d;font:600 16px Inter,Arial,sans-serif}
.label{fill:#e7ece4;font:800 17px Inter,Arial,sans-serif}.body{fill:#9ca79c;font:500 14px Inter,Arial,sans-serif}
.mono{fill:#d6ded2;font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace}.arrow{stroke:#d9ff00;stroke-width:3;fill:none;marker-end:url(#arrow)}
.mutedline{stroke:#354033;stroke-width:2;fill:none}.small{fill:#6f796e;font:600 12px Inter,Arial,sans-serif;letter-spacing:1.5px}
.accent{fill:#d9ff00;font:900 13px Inter,Arial,sans-serif;letter-spacing:2px}.good{fill:#66df9a;font:800 14px Inter,Arial,sans-serif}.warn{fill:#ffb15a;font:800 14px Inter,Arial,sans-serif}</style></defs><rect class="bg" width="100%" height="100%" rx="28"/><text class="title" x="500" y="60" text-anchor="middle">THE TWO WAYS TO GET INTUNE</text><rect class="limebox" x="100" y="120" width="800" height="90" rx="22"/><text class="label" x="500" y="153" text-anchor="middle">WAY 1: Bundled inside an M365 / EMS plan</text><text class="sub" x="500" y="183" text-anchor="middle">Most common for companies</text><rect class="box" x="100" y="280" width="800" height="90" rx="22"/><text class="label" x="500" y="313" text-anchor="middle">WAY 2: Standalone Intune Plan 1 or Plan 2</text><text class="sub" x="500" y="343" text-anchor="middle">For specific add-on needs</text><path class="arrow" d="M500 210 L500 280"/></svg>