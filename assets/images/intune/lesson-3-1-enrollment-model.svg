<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080c08"/><stop offset="1" stop-color="#030503"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9ff00"/></marker><style>.box{fill:#070b08;stroke:#263426;stroke-width:1.5}.accentbox{fill:#0b1107;stroke:#6c7600;stroke-width:1.5}.mutebox{fill:#050805;stroke:#1c281d;stroke-width:1.2}</style></defs><title id="title">Intune enrollment decision</title><desc id="desc">AshScript native Intune tutorial diagram.</desc><rect width="1100" height="620" rx="28" fill="url(#bg)"/><path d="M35 60H1065" stroke="#d9ff00" stroke-opacity=".12"/><path d="M35 564H1065" stroke="#d9ff00" stroke-opacity=".08"/><text x="38" y="40" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="900" fill="#879287" text-anchor="start" letter-spacing="1.8"><tspan x="38" dy="0">ENROLLMENT DECISION MODEL</tspan></text><rect class="accentbox" x="60" y="82" width="460" height="120" rx="18"/><text x="78" y="112" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#d9ff00" text-anchor="start" letter-spacing="0.8"><tspan x="78" dy="0">QUESTION 1: WHO OWNS THE DEVICE</tspan></text><text x="78" y="140" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="78" dy="0">Corporate-owned → Full MDM enrollment</tspan><tspan x="78" dy="19.5">Personal (BYOD) → MAM or lightweight MDM</tspan></text><rect class="accentbox" x="580" y="82" width="460" height="120" rx="18"/><text x="598" y="112" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#d9ff00" text-anchor="start" letter-spacing="0.8"><tspan x="598" dy="0">QUESTION 2: CAN WE PRE-CONFIGURE IT</tspan></text><text x="598" y="140" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="598" dy="0">Yes → Zero-touch / automated enrollment</tspan><tspan x="598" dy="19.5">No → User-driven or manual enrollment</tspan></text><rect class="accentbox" x="45.0" y="250" width="187.6" height="190" rx="18"/><text x="63.0" y="280" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#d9ff00" text-anchor="start" letter-spacing="0.8"><tspan x="63.0" dy="0">WINDOWS</tspan></text><text x="63.0" y="308" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="63.0" dy="0">Autopilot • Co-</tspan><tspan x="63.0" dy="19.5">management • GPO</tspan><tspan x="63.0" dy="19.5">auto-enrollment •</tspan><tspan x="63.0" dy="19.5">OOBE • Bulk</tspan></text><rect class="box" x="250.6" y="250" width="187.6" height="190" rx="18"/><text x="268.6" y="280" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#f1f5ef" text-anchor="start" letter-spacing="0.8"><tspan x="268.6" dy="0">macOS</tspan></text><text x="268.6" y="308" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="268.6" dy="0">ADE • Company Portal</tspan></text><rect class="box" x="456.2" y="250" width="187.6" height="190" rx="18"/><text x="474.2" y="280" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#f1f5ef" text-anchor="start" letter-spacing="0.8"><tspan x="474.2" dy="0">ANDROID</tspan></text><text x="474.2" y="308" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="474.2" dy="0">Work Profile • Fully</tspan><tspan x="474.2" dy="19.5">Managed • COPE •</tspan><tspan x="474.2" dy="19.5">Dedicated</tspan></text><rect class="box" x="661.8" y="250" width="187.6" height="190" rx="18"/><text x="679.8" y="280" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#f1f5ef" text-anchor="start" letter-spacing="0.8"><tspan x="679.8" dy="0">iOS / iPadOS</tspan></text><text x="679.8" y="308" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="679.8" dy="0">ADE • Apple</tspan><tspan x="679.8" dy="19.5">Configurator 2 •</tspan><tspan x="679.8" dy="19.5">Company Portal</tspan></text><rect class="box" x="867.4" y="250" width="187.6" height="190" rx="18"/><text x="885.4" y="280" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#f1f5ef" text-anchor="start" letter-spacing="0.8"><tspan x="885.4" dy="0">LINUX</tspan></text><text x="885.4" y="308" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="885.4" dy="0">Microsoft Intune app</tspan><tspan x="885.4" dy="19.5">• limited management</tspan></text><path d="M520 142H580" stroke="#d9ff00" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 202V250" stroke="#d9ff00" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="485" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#d9ff00" text-anchor="middle" letter-spacing="1.2"><tspan x="550" dy="0">METHOD FOLLOWS THE DEVICE SCENARIO</tspan></text><text x="550" y="516" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="550" fill="#c5cec3" text-anchor="middle" letter-spacing="0"><tspan x="550" dy="0">Ownership + pre-configuration ability determine the path.</tspan></text></svg>