<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080c08"/><stop offset="1" stop-color="#030503"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9ff00"/></marker><style>.box{fill:#070b08;stroke:#263426;stroke-width:1.5}.accentbox{fill:#0b1107;stroke:#6c7600;stroke-width:1.5}.mutebox{fill:#050805;stroke:#1c281d;stroke-width:1.2}</style></defs><title id="title">Android ownership decision tree</title><desc id="desc">AshScript native Intune tutorial diagram.</desc><rect width="1100" height="720" rx="28" fill="url(#bg)"/><path d="M35 60H1065" stroke="#d9ff00" stroke-opacity=".12"/><path d="M35 664H1065" stroke="#d9ff00" stroke-opacity=".08"/><text x="42" y="42" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="900" fill="#879287" text-anchor="start" letter-spacing="1.8"><tspan x="42" dy="0">ANDROID OWNERSHIP DECISION TREE</tspan></text><rect class="accentbox" x="380" y="82" width="340" height="84" rx="18"/><text x="398" y="112" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#d9ff00" text-anchor="start" letter-spacing="0.8"><tspan x="398" dy="0">WHO OWNS THE DEVICE</tspan></text><text x="398" y="140" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="398" dy="0">Personal or company</tspan></text><rect class="box" x="90" y="230" width="330" height="110" rx="18"/><text x="108" y="260" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#f1f5ef" text-anchor="start" letter-spacing="0.8"><tspan x="108" dy="0">PERSONAL</tspan></text><text x="108" y="288" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="108" dy="0">Employee owns it</tspan></text><rect class="accentbox" x="680" y="230" width="330" height="110" rx="18"/><text x="698" y="260" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#d9ff00" text-anchor="start" letter-spacing="0.8"><tspan x="698" dy="0">COMPANY</tspan></text><text x="698" y="288" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="698" dy="0">AshScript owns it</tspan></text><path d="M550 166V210H255V230" stroke="#d9ff00" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 166V210H845V230" stroke="#d9ff00" stroke-width="2" marker-end="url(#arrow)"/><rect class="box" x="60" y="400" width="390" height="115" rx="18"/><text x="78" y="430" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#f1f5ef" text-anchor="start" letter-spacing="0.8"><tspan x="78" dy="0">EMPLOYEE OK WITH WORK PROFILE?</tspan></text><text x="78" y="458" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="78" dy="0">YES → Work Profile (BYOD)</tspan><tspan x="78" dy="19.5">NO → MAM-only (no enrollment)</tspan></text><rect class="box" x="655" y="400" width="390" height="115" rx="18"/><text x="673" y="430" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#f1f5ef" text-anchor="start" letter-spacing="0.8"><tspan x="673" dy="0">PERSONAL USE ALLOWED?</tspan></text><text x="673" y="458" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="673" dy="0">YES → COPE</tspan><tspan x="673" dy="19.5">NO → ask whether shared</tspan></text><path d="M255 340V385" stroke="#d9ff00" stroke-width="2" marker-end="url(#arrow)"/><path d="M845 340V385" stroke="#d9ff00" stroke-width="2" marker-end="url(#arrow)"/><rect class="box" x="655" y="570" width="390" height="90" rx="18"/><text x="673" y="600" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#f1f5ef" text-anchor="start" letter-spacing="0.8"><tspan x="673" dy="0">SHARED DEVICE?</tspan></text><text x="673" y="628" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="673" dy="0">YES → Dedicated (Kiosk)  •  NO → Fully Managed (COBO)</tspan></text><path d="M850 515V560" stroke="#d9ff00" stroke-width="2" marker-end="url(#arrow)"/></svg>