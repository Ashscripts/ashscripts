</style><title id="title">RBAC Components</title><desc id="desc">AshScript Intune lesson diagram</desc><rect class="bg" width="1100" height="620" rx="28"/><rect class="panel" x="45" y="105" width="310" height="210" rx="22"/><rect x="63" y="123" width="7" height="174" rx="3" fill="#d9ff00"/><text class="label white" x="87" y="152">ROLE</text><text class="small muted" x="87" y="185">What can be done?</text><text class="small muted" x="87" y="213">Read / Write / Delete</text><text class="small muted" x="87" y="241">Permissions</text><rect class="panel" x="395" y="105" width="310" height="210" rx="22"/><rect x="413" y="123" width="7" height="174" rx="3" fill="#ff9f1c"/><text class="label white" x="437" y="152">MEMBER GROUP</text><text class="small muted" x="437" y="185">Who has this role?</text><text class="small muted" x="437" y="213">Entra ID group</text><text class="small muted" x="437" y="241">of admins</text><rect class="panel" x="745" y="105" width="310" height="210" rx="22"/><rect x="763" y="123" width="7" height="174" rx="3" fill="#62a9ff"/><text class="label white" x="787" y="152">SCOPE</text><text class="small muted" x="787" y="185">Which devices / users</text><text class="small muted" x="787" y="213">can they see and manage?</text><text class="small muted" x="787" y="241">Scope tag or all devices</text><text class="label white" x="550" y="405" text-anchor="middle">Role + Member Group + Scope = Role Assignment</text></svg>