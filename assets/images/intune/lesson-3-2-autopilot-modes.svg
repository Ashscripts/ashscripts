<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080c08"/><stop offset="1" stop-color="#030503"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9ff00"/></marker><style>.box{fill:#070b08;stroke:#263426;stroke-width:1.5}.accentbox{fill:#0b1107;stroke:#6c7600;stroke-width:1.5}.mutebox{fill:#050805;stroke:#1c281d;stroke-width:1.2}</style></defs><title id="title">Autopilot deployment modes</title><desc id="desc">AshScript native Intune tutorial diagram.</desc><rect width="1100" height="470" rx="28" fill="url(#bg)"/><path d="M35 60H1065" stroke="#d9ff00" stroke-opacity=".12"/><path d="M35 414H1065" stroke="#d9ff00" stroke-opacity=".08"/><text x="42" y="42" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="900" fill="#879287" text-anchor="start" letter-spacing="1.8"><tspan x="42" dy="0">AUTOPILOT DEPLOYMENT MODES</tspan></text><rect class="accentbox" x="52" y="82" width="320" height="260" rx="18"/><text x="70" y="112" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#d9ff00" text-anchor="start" letter-spacing="0.8"><tspan x="70" dy="0">USER-DRIVEN</tspan></text><text x="70" y="140" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="70" dy="0">AshScript standard</tspan><tspan x="70" dy="19.5"></tspan><tspan x="70" dy="19.5">User signs in • device completes</tspan><tspan x="70" dy="19.5">setup in the background</tspan></text><rect class="box" x="400" y="82" width="320" height="260" rx="18"/><text x="418" y="112" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#f1f5ef" text-anchor="start" letter-spacing="0.8"><tspan x="418" dy="0">SELF-DEPLOYING</tspan></text><text x="418" y="140" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="5