<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">MDM vs MAM</title>
<desc id="d">Comparison of Mobile Device Management and Mobile Application Management, showing device ownership, management scope, examples and data-wipe behavior.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a100b"/><stop offset="1" stop-color="#030503"/></linearGradient>
  <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9ff00"/><stop offset="1" stop-color="#91b600"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .t{font:800 28px Arial,sans-serif;fill:#f4f7f3}.st{font:600 14px Arial,sans-serif;fill:#8f998d}.h{font:900 20px Arial,sans-serif;fill:#f4f7f3}.b{font:600 14px Arial,sans-serif;fill:#b7c0b6}.m{font:800 11px Arial,sans-serif;fill:#d9ff00;letter-spacing:2px}.good{font:800 14px Arial,sans-serif;fill:#67df9b}.muted{stroke:#253026;stroke-width:2}.accent{stroke:#d9ff00;stroke-width:3;fill:none}.pill{font:800 11px Arial,sans-serif;fill:#dce4d9;letter-spacing:1px}
  </style>
</defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
<text x="600" y="54" text-anchor="middle" class="t">MDM vs MAM</text>
<text x="600" y="80" text-anchor="middle" class="st">MDM = Manage the whole device. MAM = Manage just the work data on the device.</text>
<rect x="60" y="120" width="510" height="430" rx="24" fill="#080d09" stroke="#3c1f24" stroke-width="2"/>
<rect x="630" y="120" width="510" height="430" rx="24" fill="#080d09" stroke="#29400d" stroke-width="2"/>
<text x="95" y="158" class="m">01 · COMPANY-OWNED</text>
<text x="95" y="195" class="h">Mobile Device Management (MDM)</text>
<text x="95" y="226" class="st">"I own this device. I control it completely."</text>
<line x1="95" y1="252" x2="535" y2="252" class="muted"/>
<text x="95" y="282" class="pill">MANAGEMENT SCOPE</text>
<text x="95" y="309" class="b">Entire device</text>
<text x="95" y="348" class="pill">WHAT YOU CAN DO</text>
<text x="95" y="376" class="b">• Push settings (Wi-Fi, VPN, email)</text>
<text x="95" y="402" class="b">• Enforce rules and encryption</text>
<text x="95" y="428" class="b">• Deploy apps silently</text>
<text x="95" y="454" class="b">• Remotely wipe a lost or stolen device</text>
<text x="95" y="480" class="b">• See device health and compliance</text>
<rect x="95" y="505" width="440" height="28" rx="14" fill="rgba(255,77,79,.08)" stroke="#683238"/>
<text x="315" y="524" text-anchor="middle" class="good">Example: AshScript's 1,000 domain-joined laptops</text>

<text x="665" y="158" class="m">02 · PERSONAL / BYOD</text>
<text x="665" y="195" class="h">Mobile Application Management (MAM)</text>
<text x="665" y="226" class="st">"I don't own this device. But I DO own the company data on it."</text>
<line x1="665" y1="252" x2="1105" y2="252" class="muted"/>
<text x="665" y="282" class="pill">MANAGEMENT SCOPE</text>
<text x="665" y="309" class="b">Work apps and work data</text>
<text x="665" y="348" class="pill">WHAT YOU CAN DO</text>
<text x="665" y="376" class="b">• Containerize company email and files</text>
<text x="665" y="402" class="b">• Keep personal apps and photos untouched</text>
<text x="665" y="428" class="b">• Wipe only work data when access ends</text>
<text x="665" y="454" class="b">• No device enrollment needed</text>
<text x="665" y="480" class="b">• Protect company data inside supported apps</text>
<rect x="665" y="505" width="440" height="28" rx="14" fill="rgba(217,255,0,.06)" stroke="#4a610f"/>
<text x="885" y="524" text-anchor="middle" class="good">Example: personal iPhone / Android for Outlook and Teams</text>
</svg>