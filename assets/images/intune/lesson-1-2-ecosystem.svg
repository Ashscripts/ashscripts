.accent{fill:#d9ff00;font:900 13px Inter,Arial,sans-serif;letter-spacing:2px}.good{fill:#66df9a;font:800 14px Inter,Arial,sans-serif}.warn{fill:#ffb15a;font:800 14px Inter,Arial,sans-serif}</style></defs><rect class="bg" width="100%" height="100%" rx="28"/><rect class="box" x="60" y="40" width="880" height="440" rx="28"/><text class="title" x="500" y="82" text-anchor="middle">MICROSOFT 365 (M365)</text><text class="sub" x="500" y="110" text-anchor="middle">The subscription umbrella</text><rect class="limebox" x="100" y="160" width="300" height="175" rx="22"/><text class="label" x="250" y="198" text-anchor="middle">ENTRA ID</text><text class="sub" x="250" y="223" text-anchor="middle">Who are you?</text><text class="body" x="125" y="262" text-anchor="start">Users · Groups · Identities · Auth/MFA</text><rect class="limebox" x="600" y="160" width="300" height="175" rx="22"/><text class="label" x="750" y="198" text-anchor="middle">MICROSOFT INTUNE</text><text class="sub" x="750" y="223" text-anchor="middle">What can you do?</text><text class="body" x="625" y="262" text-anchor="start">Devices · Apps · Compliance · Profiles</text><path class="arrow" d="M400 247 L600 247"/><rect class="limebox" x="310" y="365" width="380" height="78" rx="20"/><text class="label" x="500" y="398" text-anchor="middle">CONDITIONAL ACCESS</text><text class="sub" x="500" y="423" text-anchor="middle">Identity + Device must BOTH be trusted</text><path class="arrow" d="M250 335 L420 365"/><path class="arrow" d="M750 335 L580 365"/></svg>