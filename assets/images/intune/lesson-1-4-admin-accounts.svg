<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="t d"><title id="t">Admin account plan</title><desc id="d">Diagram for Admin account plan</desc><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0c130d"/><stop offset="1" stop-color="#050805"/></linearGradient><linearGradient id="lime" x1="0" x2="1"><stop offset="0" stop-color="#d9ff00"/><stop offset="1" stop-color="#93b800"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9ff00"/></marker><style>.bg{fill:#030503}.box{fill:url(#panel);stroke:#243224;stroke-width:2}.limebox{fill:#0b1008;stroke:#d9ff00;stroke-width:2}
