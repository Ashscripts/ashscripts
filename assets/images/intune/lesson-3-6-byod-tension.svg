<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080c08"/><stop offset="1" stop-color="#030503"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9ff00"/></marker><style>.box{fill:#070b08;stroke:#263426;stroke-width:1.5}.accentbox{fill:#0b1107;stroke:#6c7600;stroke-width:1.5}.mutebox{fill:#050805;stroke:#1c281d;stroke-width:1.2}</style></defs><title id="title">BYOD tension and MAM solution</title><desc id="desc">AshScript native Intune tutorial diagram.</desc><rect width="1100" height="560" rx="28" fill="url(#bg)"/><path d="M35 60H1065" stroke="#d9ff00" stroke-opacity=".12"/><path d="M35 504H1065" stroke="#d9ff00" stroke-opacity=".08"/><text x="42" y="42" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="900" fill="#879287" text-anchor="start" letter-spacing="1.8"><tspan x="42" dy="0">BYOD TENSION: SECURITY VS PRIVACY</tspan></text><rect class="accentbox" x="60" y="98" width="420" height="230" rx="18"/><text x="78" y="128" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#d9ff00" text-anchor="start" letter-spacing="0.8"><tspan x="78" dy="0">COMPANY NEEDS</tspan></text><text x="78" y="156" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="78" dy="0">Protect company data</tspan><tspan x="78" dy="19.5">Prevent data leakage</tspan><tspan x="78" dy="19.5">Remote wipe if needed</tspan><tspan x="78" dy="19.5">Enforce encryption</tspan><tspan x="78" dy="19.5">Control app access</tspan><tspan x="78" dy="19.5">Compliance enforcement</tspan></text><rect class="box" x="620" y="98" width="420" height="230" rx="18"/><text x="638" y="128" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#f1f5ef" text-anchor="start" letter-spacing="0.8"><tspan x="638" dy="0">EMPLOYEE NEEDS</tspan></text><text x="638" y="156" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="638" dy="0">Privacy on personal device</tspan><tspan x="638" dy="19.5">No IT access to personal files/photos/apps</tspan><tspan x="638" dy="19.5">No risk of personal data being wiped</tspan><tspan x="638" dy="19.5">Keep personal device personal</tspan></text><rect class="accentbox" x="300" y="385" width="500" height="110" rx="18"/><text x="318" y="415" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#d9ff00" text-anchor="start" letter-spacing="0.8"><tspan x="318" dy="0">MODERN MAM APPROACH</tspan></text><text x="318" y="443" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="550" fill="#b6c1b6" text-anchor="start" letter-spacing="0"><tspan x="318" dy="0">Protect only company DATA → not the device</tspan><tspan x="318" dy="19.5">Company data secured → employee privacy preserved</tspan></text><path d="M480 210H620" stroke="#d9ff00" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M830 328V382" stroke="#d9ff00" stroke-width="2.2" marker-end="url(#arrow)"/></svg>