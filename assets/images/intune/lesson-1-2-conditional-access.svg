<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t d"><title id="t">Conditional Access flow</title><desc id="d">Diagram for Conditional Access flow</desc><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0c130d"/><stop offset="1" stop-color="#050805"/></linearGradient><linearGradient id="lime" x1="0" x2="1"><stop offset="0" stop-color="#d9ff00"/><stop offset="1" stop-color="#93b800"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9ff00"/></marker><style>.bg{fill:#030503}.box{fill:url(#panel);stroke:#243224;stroke-width:2}.limebox{fill:#0b1008;stroke:#d9ff00;stroke-width:2}
.title{fill:#f4f7f3;font:800 26px Inter,Arial,sans-serif}.sub{fill:#8f998d;font:600 16px Inter,Arial,sans-serif}
.label{fill:#e7ece4;font:800 17px Inter,Arial,sans-serif}.body{fill:#9ca79c;font:500 14px Inter,Arial,sans-serif}
.mono{fill:#d6ded2;font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace}.arrow{stroke:#d9ff00;stroke-width:3;fill:none;marker-end:url(#arrow)}
.mutedline{stroke:#354033;stroke-width:2;fill:none}.small{fill:#6f796e;font:600 12px Inter,Arial,sans-serif;letter-spacing:1.5px}
.accent{fill:#d9ff00;font:900 13px Inter,Arial,sans-serif;letter-spacing:2px}.good{fill:#66df9a;font:800 14px Inter,Arial,sans-serif}.warn{fill:#ffb15a;font:800 14px Inter,Arial,sans-serif}</style></defs><rect class="bg" width="100%" height="100%" rx="28"/><text class="title" x="70" y="60" text-anchor="start">CONDITIONAL ACCESS</text><text class="sub" x="70" y="92" text-anchor="start">The policy engine makes a real-time access decision.</text><rect class="box" x="70" y="135" width="360" height="100" rx="18"/><text class="label" x="100" y="170" text-anchor="start">QUESTION 1: ENTRA ID</text><text class="body" x="100" y="198" text-anchor="start">Is this USER who they claim to be?</text><text class="good" x="100" y="221" text-anchor="start"> Valid identity + MFA passed</text><rect class="box" x="570" y="135" width="360" height="100" rx="18"/><text class="label" x="600" y="170" text-anchor="start">QUESTION 2: INTUNE</text><text class="body" x="600" y="198" text-anchor="start">Is this DEVICE healthy and compliant?</text><text class="good" x="600" y="221" text-anchor="start"> Encrypted + updated + no malware</text><path class="arrow" d="M430 185 L570 185"/><text class="accent" x="500" y="175" text-anchor="middle">AND</text><rect class="limebox" x="245" y="305" width="510" height="110" rx="22"/><text class="label" x="500" y="342" text-anchor="middle">BOTH trusted? → ACCESS GRANTED</text><text class="warn" x="500" y="372" text-anchor="middle">Either fails? → ACCESS BLOCKED</text><path class="arrow" d="M250 235 L410 305"/><path class="arrow" d="M750 235 L590 305"/></svg>