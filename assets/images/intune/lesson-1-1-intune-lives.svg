<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Where Does Intune Live?</title><desc id="d">Diagram for Where Does Intune Live?</desc><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0c130d"/><stop offset="1" stop-color="#050805"/></linearGradient><linearGradient id="lime" x1="0" x2="1"><stop offset="0" stop-color="#d9ff00"/><stop offset="1" stop-color="#93b800"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9ff00"/></marker><style>.bg{fill:#030503}.box{fill:url(#panel);stroke:#243224;stroke-width:2}.limebox{fill:#0b1008;stroke:#d9ff00;stroke-width:2}
.title{fill:#f4f7f3;font:800 26px Inter,Arial,sans-serif}.sub{fill:#8f998d;font:600 16px Inter,Arial,sans-serif}
.label{fill:#e7ece4;font:800 17px Inter,Arial,sans-serif}.body{fill:#9ca79c;font:500 14px Inter,Arial,sans-serif}
.mono{fill:#d6ded2;font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace}.arrow{stroke:#d9ff00;stroke-width:3;fill:none;marker-end:url(#arrow)}
.mutedline{stroke:#354033;stroke-width:2;fill:none}.small{fill:#6f796e;font:600 12px Inter,Arial,sans-serif;letter-spacing:1.5px}
.accent{fill:#d9ff00;font:900 13px Inter,Arial,sans-serif;letter-spacing:2px}.good{fill:#66df9a;font:800 14px Inter,Arial,sans-serif}.warn{fill:#ffb15a;font:800 14px Inter,Arial,sans-serif}</style></defs><rect class="bg" width="100%" height="100%" rx="28"/><rect class="box" x="70" y="55" width="860" height="410" rx="28"/><text class="title" x="500" y="95" text-anchor="middle">MICROSOFT 365 (M365)</text><text class="sub" x="500" y="123" text-anchor="middle">The subscription umbrella</text><rect class="limebox" x="115" y="165" width="330" height="180" rx="22"/><text class="label" x="280" y="205" text-anchor="middle">ENTRA ID</text><text class="sub" x="280" y="231" text-anchor="middle">(Who are you?)</text><text class="body" x="145" y="270" text-anchor="start">• Users</text><text class="body" x="145" y="298" text-anchor="start">• Groups</text><text class="body" x="145" y="326" text-anchor="start">• Identities</text><rect class="limebox" x="555" y="165" width="330" height="180" rx="22"/><text class="label" x="720" y="205" text-anchor="middle">MICROSOFT INTUNE</text><text class="sub" x="720" y="231" text-anchor="middle">(What can you do?)</text><text class="body" x="585" y="270" text-anchor="start">• Device Management</text><text class="body" x="585" y="298" text-anchor="start">• App Management</text><text class="body" x="585" y="326" text-anchor="start">• Compliance Policies</text><path class="arrow" d="M445 255 L555 255"/><path class="mutedline" d="M555 290 L445 290"/><rect class="limebox" x="315" y="375" width="370" height="65" rx="18"/><text class="label" x="500" y="403" text-anchor="middle">Handles IDENTITY + DEVICES together</text><text class="sub" x="500" y="425" text-anchor="middle">Entra ID + Intune</text><path class="arrow" d="M280 345 L420 375"/><path class="arrow" d="M720 345 L580 375"/></svg>