<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<style>
.bg{fill:#050805}.panel{fill:#0a100b;stroke:#1f2a20;stroke-width:2}.lime{fill:#d9ff00}.white{fill:#f4f7f3}.muted{fill:#8e9a8e}.orange{fill:#ff9f1c}.blue{fill:#62a9ff}.green{fill:#66df9a}.red{fill:#ff6b7a}
.label{font:800 22px Inter,Arial,sans-serif;letter-spacing:.02em}.small{font:700 16px Inter,Arial,sans-serif}.kicker{font:900 13px Inter,Arial,sans-serif;letter-spacing:2px}
</style><title id="title">Authentication Methods</title><desc id="desc">AshScript Intune lesson diagram</desc><rect class="bg" width="1100" height="620" rx="28"/><rect class="panel" x="45" y="105" width="320" height="240" rx="22"/><rect x="63" y="123" width="7" height="204" rx="3" fill="#d9ff00"/><text class="label white" x="87" y="152">PASSWORD HASH SYNC (PHS)</text><text class="small muted" x="87" y="185">Authentication happens in cloud</text><text class="small muted" x="87" y="213">Works if on-prem is offline</text><text class="small muted" x="87" y="241">No extra infrastructure</text><rect class="panel" x="390" y="105" width="320" height="240" rx="22"/><rect x="408" y="123" width="7" height="204" rx="3" fill="#ff9f1c"/><text class="label white" x="432" y="152">PASS-THROUGH AUTH (PTA)</text><text class="small muted" x="432" y="185">Credential checked by AD</text><text class="small muted" x="432" y="213">Requires on-prem agent</text><text class="small muted" x="432" y="241">Cloud sign-in depends on AD</text><rect class="panel" x="735" y="105" width="320" height="240" rx="22"/><rect x="753" y="123" width="7" height="204" rx="3" fill="#a78bfa"/><text class="label white" x="777" y="152">FEDERATION (ADFS)</text><text class="small muted" x="777" y="185">Separate federation server</text><text class="small muted" x="777" y="213">Most complex / expensive</text><text class="small muted" x="777" y="241">For complex enterprise auth</text><text class="kicker" x="550" y="420" text-anchor="middle" fill="#d9ff00">ASHSCRIPT CHOICE: PASSWORD HASH SYNC</text></svg>