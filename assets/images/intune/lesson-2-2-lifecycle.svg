</style><title id="title">Identity Lifecycle</title><desc id="desc">AshScript Intune lesson diagram</desc><rect class="bg" width="1100" height="620" rx="28"/><rect class="panel" x="65" y="105" width="300" height="155" rx="22"/><rect x="83" y="123" width="7" height="119" rx="3" fill="#66df9a"/><text class="label white" x="107" y="152">JOINER</text><text class="small muted" x="107" y="185">HR creates user in AD</text><text class="small muted" x="107" y="213">→ sync → user can sign in</text><rect class="panel" x="400" y="105" width="300" height="155" rx="22"/><rect x="418" y="123" width="7" height="119" rx="3" fill="#62a9ff"/><text class="label white" x="442" y="152">MOVER</text><text class="small muted" x="442" y="185">Department changes in AD</text><text class="small muted" x="442" y="213">→ sync → dynamic group updates</text><rect class="panel" x="735" y="105" width="300" height="155" rx="22"/><rect x="753" y="123" width="7" height="119" rx="3" fill="#ff6b7a"/><text class="label white" x="777" y="152">LEAVER</text><text class="small muted" x="777" y="185">Account disabled in AD</text><text class="small muted" x="777" y="213">→ sync → access blocked</text><defs><marker id="am300" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d9ff00"/></marker></defs><path d="M365 180 L395 180" stroke="#d9ff00" stroke-width="3" fill="none" marker-end="url(#am300)"/><defs><marker id="am300" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d9ff00"/></marker></defs><path d="M700 180 L730 180" stroke="#d9ff00" stroke-width="3" fill="none" marker-end="url(#am300)"/><text class="small muted" x="550" y="345" text-anchor="middle">The cloud reflects the on-premises lifecycle instead of maintaining a second source of truth.</text></svg>